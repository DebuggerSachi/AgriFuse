<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration | CarbonAid</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #15803d; --accent: #22c55e; --light: #f0fdf4; }
        body { font-family: 'Inter', sans-serif; background: var(--light); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569; }
        .form-group input { width: 100%; padding: 0.8rem 1rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(21, 128, 61, 0.1); }
        .btn-submit { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 0.75rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 1rem; }
        .btn-submit:hover { background: #14532d; transform: translateY(-2px); }
        .auth-footer { text-align: center; margin-top: 1.5rem; color: #64748b; font-size: 0.9rem; }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-seedling" style="font-size: 2.5rem; color: var(--accent); margin-bottom: 1rem;"></i>
            <h1>Farmer Registration</h1>
            <p>Start your sustainability journey</p>
        </div>
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Unique mobile number" required>
            </div>
            <div class="form-group">
                <label>Village / Location</label>
                <input type="text" id="location" placeholder="Where is your farm?" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn-submit">Register as Farmer</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="/carbonaid/farmer/login">Login here</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                location: document.getElementById('location').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/carbonaid/api/farmer/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    alert('Registration successful! Please login.');
                    window.location.href = '/carbonaid/farmer/login';
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('An error occurred. Please try again.');
            }
        });
    </script>
</body>
</html>
